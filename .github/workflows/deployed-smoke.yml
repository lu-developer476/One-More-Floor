name: Deployed smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL pública que ya expone la versión esperada
        required: true
        default: https://one-more-floor.onrender.com
permissions: { contents: read }
jobs:
  smoke:
    name: Deployed smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22.12.0, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: OMF_BASE_URL=${{ inputs.base_url }} npm run test:deployed
